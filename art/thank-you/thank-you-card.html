<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Play;src:url(playfair-display-latin-400-normal.woff2);font-weight:400;font-style:normal}
@font-face{font-family:Play;src:url(playfair-display-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:Play;src:url(playfair-display-latin-600-italic.woff2);font-weight:600;font-style:italic}
@font-face{font-family:Tam;src:url(noto-serif-tamil-tamil-600-normal.woff2);font-weight:600}
@font-face{font-family:Man;src:url(manrope-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Man;src:url(manrope-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;padding:0}
.card{position:relative;width:1600px;height:900px;overflow:hidden;font-family:Man,sans-serif}
.ty{font-family:Play,serif;font-style:italic;font-weight:600;line-height:1}
.gold{background:linear-gradient(180deg,#FFF1CF 0%,#E8C47E 55%,#C99A4A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(30,5,5,.35))}
.ta{font-family:Tam,serif;font-weight:600;line-height:1.3}
.for{font-family:Play,serif;font-style:italic;font-weight:400;line-height:1.35}
.for b{font-style:normal;font-weight:400;letter-spacing:.06em}
.addr{font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.frame{position:absolute;inset:36px;border:2px solid rgba(226,190,120,.85);pointer-events:none}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(226,190,120,.5)}
.col{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.logo{height:auto}
.maroonlogo{display:block;background:#7E2323;-webkit-mask:url(logo-cream.png) center/contain no-repeat;mask:url(logo-cream.png) center/contain no-repeat}

/* 1: classic maroon */
.v1{background:#7E2323 url(texture-red.jpg) center/cover;color:#F7EBDD}
.v1::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(120,30,30,0) 0%,rgba(40,10,10,.45) 100%)}
.v1 .left{left:0;width:560px}
.v1 .sep{position:absolute;left:560px;top:150px;bottom:150px;width:1px;background:linear-gradient(transparent,rgba(226,190,120,.8),transparent)}
.v1 .right{left:560px;right:0;padding:0 60px}

/* 2: necklace photo + maroon */
.v2{background:#6E1F1F url(texture-red.jpg) center/cover;color:#F7EBDD}
.v2 .ph{position:absolute;left:0;top:0;bottom:0;width:700px;background:url(necklace.jpg) center 38%/cover}
.v2 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 70%,rgba(110,31,31,.95) 100%)}
.v2 .right{left:700px;right:0;padding:0 70px}

/* 3: cream and the ring */
.v3{background:linear-gradient(135deg,#FBF4E8,#F1E4CC);color:#6E1F1F}
.v3 .ph{position:absolute;right:0;top:0;bottom:0;width:720px;background:url(ring-diamond.jpg) center 45%/cover}
.v3 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#F7EEDD 0%,rgba(247,238,221,0) 28%)}
.v3 .left{left:0;width:880px;padding:0 50px;box-sizing:border-box}
.v3 .frame{border-color:rgba(176,132,60,.7)} .v3 .frame::after{border-color:rgba(176,132,60,.4)}
.v3 .ty{color:#7E2323;filter:none;background:none;-webkit-background-clip:initial}

/* 4: temple necklace on banana leaf */
.v4{background:#22361F;color:#F7EBDD}
.v4 .ph{position:absolute;right:0;top:0;bottom:0;width:760px;background:url(story.jpg) center 30%/cover}
.v4 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(94,24,24,1) 0%,rgba(94,24,24,0) 30%)}
.v4 .bg{position:absolute;left:0;top:0;bottom:0;width:860px;background:#6E1F1F url(texture-red.jpg) center/cover}
.v4 .left{left:0;width:860px;padding:0 50px;box-sizing:border-box}
</style></head>
<body>
<div class="card" id="card"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || '1', c = document.getElementById('card');
const neck = (gold, light, w) => {
  let s = '<svg width="' + (w || 360) + '" viewBox="0 0 420 150">';
  s += '<path d="M20 4 Q210 150 400 4" fill="none" stroke="' + gold + '" stroke-width="1.2" opacity=".7"/>';
  for(let i = 0; i <= 26; i++){ const t = i / 26, x = (1 - t) * (1 - t) * 20 + 2 * (1 - t) * t * 210 + t * t * 400, y = (1 - t) * (1 - t) * 4 + 2 * (1 - t) * t * 150 + t * t * 4;
    s += '<circle cx="' + x + '" cy="' + y + '" r="' + (i % 2 ? 3.2 : 4.6) + '" fill="' + (i % 2 ? light : gold) + '"/>'; }
  s += '<path d="M210 80 l14 16 -14 22 -14 -22z" fill="none" stroke="' + gold + '" stroke-width="2"/><path d="M210 86 l8 10 -8 13 -8 -13z" fill="' + gold + '"/>';
  s += '<circle cx="210" cy="128" r="6.5" fill="' + light + '"/></svg>';
  return s;
};
const div = (g, w) => '<svg width="' + (w || 320) + '" height="18" viewBox="0 0 360 18"><path d="M0 9H150M210 9H360" stroke="' + g + '" stroke-width="1.5"/><path d="M180 1l8 8-8 8-8-8z" fill="' + g + '"/><circle cx="160" cy="9" r="2.5" fill="' + g + '"/><circle cx="200" cy="9" r="2.5" fill="' + g + '"/></svg>';
const words = (o) => '<div class="ty ' + (o.goldText === false ? '' : 'gold') + '" style="font-size:' + (o.ty || 150) + 'px">Thank you</div>' +
  '<div class="ta" style="font-size:' + (o.ta || 64) + 'px;margin-top:10px;color:' + (o.ink || '#F7EBDD') + '">நன்றி</div>' +
  '<div style="margin:24px 0 22px">' + div(o.g || '#E2BE78') + '</div>' +
  '<div class="for" style="font-size:' + (o.fo || 40) + 'px;color:' + (o.ink || '#F7EBDD') + '">for choosing <b>Natraj Jewels</b></div>' +
  '<div style="font-size:' + (o.ho || 26) + 'px;line-height:1.5;margin-top:18px;color:' + (o.soft || 'rgba(247,235,221,.88)') + '">We hope your jewellery brings you joy<br>for many years to come.</div>' +
  '<div class="addr" style="font-size:19px;margin-top:40px;color:' + (o.g || '#E2BE78') + '">24, Eswaran Kovil St · Tiruppur</div>';
if(v === '1'){
  c.className = 'card v1';
  c.innerHTML = '<div class="frame"></div><div class="col left"><img class="logo" src="logo-cream.png" style="width:330px"><div style="margin-top:56px">' + neck('#E8C47E', '#F7EBDD', 320) + '</div></div><div class="sep"></div>' +
    '<div class="col right">' + words({ty: 160}) + '</div>';
}
if(v === '2'){
  c.className = 'card v2';
  c.innerHTML = '<div class="ph"></div><div class="col right"><img class="logo" src="logo-cream.png" style="width:220px;margin-bottom:34px">' + words({ty: 140}) + '</div>';
}
if(v === '3'){
  c.className = 'card v3';
  c.innerHTML = '<div class="ph"></div><div class="frame"></div><div class="col left"><img class="logo" src="logo-maroon.png" style="width:230px;margin-bottom:30px">' +
    words({ty: 146, goldText: false, ink: '#6E1F1F', soft: 'rgba(80,40,30,.85)', g: '#B0843C'}) + '</div>';
}
if(v === '4'){
  c.className = 'card v4';
  c.innerHTML = '<div class="bg"></div><div class="ph"></div><div class="frame"></div><div class="col left"><img class="logo" src="logo-cream.png" style="width:220px;margin-bottom:32px">' + words({ty: 146}) + '</div>';
}
</script>
</body></html>
