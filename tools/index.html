<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3B2420">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Natraj Jewels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared/natraj.css">
<style>
.taskmeter{display:grid;gap:10px;background:var(--card);border-color:var(--line);max-width:560px}
.taskmeter .tm-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.taskmeter .tm-head a{color:var(--maroon);font-weight:600;font-size:.88rem}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.hrow .heading{margin:0}
.todayrate{display:grid;gap:8px;padding:14px 18px;border:1px solid var(--line);border-radius:4px;background:var(--card);text-decoration:none;color:var(--ink);min-width:min(100%,320px)}
.todayrate:hover{border-color:var(--gold)}
.todayrate .lab{font:600 .72rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.todayrate .vals{display:flex;gap:28px;flex-wrap:wrap}
.todayrate .v{display:grid;gap:2px}
.todayrate .v span{font-size:.8rem;font-weight:600;color:var(--muted)}
.todayrate .v b{font:700 1.6rem/1.05 var(--display);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.todayrate .v b small{font:600 .78rem var(--body);color:var(--muted)}
.todayrate .v em{font-style:normal;font-size:.76rem;font-weight:700}
.todayrate .v em.up{color:var(--p)} .todayrate .v em.down{color:var(--a)}
.todayrate .when{font-size:.78rem;color:var(--muted)}
.todayrate.old .vals{opacity:.55}
@media (max-width:640px){.todayrate{width:100%}}
</style>
</head>
<body class="signed-out not-owner">

<header class="top">
  <div class="wrap">
    <span class="brand"><img src="img/logo-cream.png" alt="Natraj Jewels: Gold, Silver, Diamond"></span>
    <div class="access" id="access"></div>
    <div class="tabs" aria-hidden="true"></div>
  </div>
</header>

<main>
  <section>
    <div class="band"><div class="wrap">
      <div class="hrow"><div class="heading"><span class="eyebrow" id="hEyebrow">Welcome</span><h2 id="hTitle">Natraj Jewels tools</h2></div>
      <a class="todayrate" id="todayRate" href="rates/" hidden></a></div>
    </div></div>
    <div class="wrap content">
      <div id="home" class="loading">Loading…</div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <img src="img/logo-cream.png" alt="Natraj Jewels">
    <span>24, Eswaran Kovil St, Tiruppur 641604</span>
    <span>© <span id="year">2026</span> Natraj Jewels</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="shared/natraj.js"></script>
<script>
(function(){
'use strict';
const {esc, APPS} = NJ;
const box = document.getElementById('home');

function tile(href, name, desc, cls, ic){
  return '<a class="tile' + (cls ? ' ' + cls : '') + '" href="' + href + '"><span class="tile-top"><span class="tile-ic">' + NJ.icon(ic) + '</span><span class="eyebrow">' + (cls === 'owner' ? 'Owner' : 'App') + '</span></span><h3>' + esc(name) + '</h3><p>' + esc(desc) + '</p><span class="go">Open ›</span></a>';
}

async function render(me){
  if(!me){
    document.getElementById('todayRate').hidden = true;
    const setup = (await NJ.sb.rpc('setup_needed')).data === true;
    document.getElementById('hEyebrow').textContent = setup ? 'First time' : 'Welcome';
    document.getElementById('hTitle').textContent = setup ? 'Set up the owner' : 'Sign in to continue';
    box.className = '';
    box.innerHTML = '<div class="tiles">' +
      '<div class="form panel"><h3>' + (setup ? 'Set up the owner' : 'Sign in') + '</h3>' +
        '<p>' + (setup ? 'Choose the owner’s name and a 6-digit PIN. You will get a recovery code to write down.' : 'Choose your name and enter your 6-digit PIN.') + '</p>' +
        '<div class="bar"><button class="btn btn-maroon" id="go">' + (setup ? 'Set up the owner' : 'Sign in') + '</button></div></div>' +
      tile('attendance/#leave', 'Apply for leave', 'No PIN needed. Send a leave request for approval.', '', 'leave') +
    '</div>';
    document.getElementById('go').onclick = () => setup ? NJ.setupFlow() : NJ.signInFlow();
    return;
  }
  document.getElementById('hEyebrow').textContent = me.is_owner ? 'Owner' : 'Welcome';
  document.getElementById('hTitle').textContent = 'Hello, ' + me.name.split(' ')[0];
  const apps = Object.entries(APPS).filter(([k, a]) => NJ.canUse(k) || a.everyone);
  let h = '';
  if(me.is_owner){
    h += tile('dashboard/', 'Dashboard', 'Today at a glance: attendance, leave waiting and this month’s totals.', 'owner', 'dashboard');
    h += tile('people/', 'People & settings', 'Who can sign in, which apps they use, the staff list and shop settings.', 'owner', 'people');
    h += tile('report/', 'Staff report card', 'Each staff member’s month: attendance, tasks and work in the apps, with your ratings and remarks.', 'owner', 'report');
  }
  h += apps.map(([k, a]) => tile(a.path, a.name, a.desc, '', k)).join('');
  if(!apps.length && !me.is_owner) h += '<div class="form panel"><h3>No apps yet</h3><p>Ask the owner to give you access to the apps you need.</p></div>';
  h += tile('attendance/#leave', 'Apply for leave', 'Send a leave request for approval.', '', 'leave');
  box.className = '';
  box.innerHTML = '<p class="notice" id="due" hidden></p><div class="notice taskmeter" id="taskDue" hidden></div><p class="notice" id="fuDue" hidden></p><p class="notice" id="desDue" hidden></p><div class="tiles">' + h + '</div>';
  // staff see their report card once the owner has shared one
  if(!me.is_owner && me.staff_id) NJ.sb.from('report_cards').select('id').eq('shared', true).limit(1).then(r => {
    const grid = box.querySelector('.tiles');
    if(grid && r.data && r.data.length && !grid.querySelector('[href="report/"]')) grid.insertAdjacentHTML('beforeend', tile('report/', 'My report card', 'Your monthly report card from the owner: attendance, tasks, work done and remarks.', '', 'report'));
  });
  rateReminder(me).catch(() => {});
  showTodayRate().catch(() => {});
  taskReminder(me).catch(() => {});
  followReminder(me).catch(() => {});
  designReminder(me).catch(() => {});
}

/* Today's 22K gold and silver rate, at the top, as soon as it is entered */
async function showTodayRate(){
  const box = document.getElementById('todayRate');
  if(!NJ.me){ box.hidden = true; return; }
  const {data} = await NJ.sb.from('rates').select('gold_22k,silver,set_at,set_by_name').order('set_at', {ascending: false}).limit(30);
  const rows = data || [];
  if(!rows.length){ box.hidden = true; return; }
  const cur = rows[0], day = t => NJ.iso(new Date(t)), isToday = day(cur.set_at) === NJ.todayIso();
  const prev = rows.find(r => day(r.set_at) < day(cur.set_at));      // the last rate from an earlier day
  const money = (n, dp) => '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits: dp, maximumFractionDigits: 2});
  const change = (a, b, dp) => { if(!b) return ''; const d = Math.round((Number(a) - Number(b)) * 100) / 100; return d ? '<em class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲ ' : '▼ ') + money(Math.abs(d), dp) + '</em>' : '<em>no change</em>'; };
  const time = new Date(cur.set_at).toLocaleTimeString('en-IN', {hour: 'numeric', minute: '2-digit'});
  box.className = 'todayrate' + (isToday ? '' : ' old');
  box.innerHTML = '<span class="lab">' + (isToday ? 'Today’s rate' : 'Today’s rate is not in yet') + '</span>' +
    '<span class="vals"><span class="v"><span>22K gold</span><b>' + money(cur.gold_22k, 0) + '<small> /g</small></b>' + (isToday ? change(cur.gold_22k, prev && prev.gold_22k, 0) : '') + '</span>' +
    '<span class="v"><span>Silver</span><b>' + money(cur.silver, 2) + '<small> /g</small></b>' + (isToday ? change(cur.silver, prev && prev.silver, 2) : '') + '</span></span>' +
    '<span class="when">' + (isToday ? 'Updated ' + time + (cur.set_by_name ? ' by ' + NJ.esc(cur.set_by_name) : '') : 'Last rate, from ' + new Date(cur.set_at).toLocaleDateString('en-IN', {day: 'numeric', month: 'short'})) + '</span>';
  box.hidden = false;
}
// keep it current while the home page stays open
setInterval(() => { if(document.visibilityState === 'visible') showTodayRate().catch(() => {}); }, 120000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') showTodayRate().catch(() => {}); });

/* The person who updates the gold & silver rate sees a reminder until today's rate is in. */
async function rateReminder(me){
  const [st, last, who] = await Promise.all([
    NJ.sb.from('settings').select('rate_due').eq('id', 1).maybeSingle(),
    NJ.sb.from('rates').select('set_at').order('set_at', {ascending: false}).limit(1),
    NJ.sb.rpc('rate_updaters')
  ]);
  const s = NJ.rateStatus(st.data, (last.data || [])[0], who.data);
  const box = document.getElementById('due');
  if(!box || !s.assignee || s.done || !(s.mine || (me.is_owner && s.late))) return;
  box.hidden = false;
  if(s.late) box.style.cssText = 'border-color:var(--a);background:var(--a-bg);color:var(--a);font-weight:600';
  box.innerHTML = (s.mine ? (s.late ? 'Late: please enter today’s gold &amp; silver rate. It was due by ' : 'Today’s gold &amp; silver rate is due by ') + esc(s.dueLabel) + '.'
    : 'Today’s rate is not in yet (' + esc(s.name) + ' ' + s.verb + ' it). It was due by ' + esc(s.dueLabel) + '.') +
    ' <a href="' + NJ.APPS.rates.path + '" style="color:inherit;font-weight:600">' + (s.mine ? 'Enter the rate ›' : 'Open the rate ›') + '</a>';
}

/* Anyone with tasks today sees their meter: done today against what is left. */
async function taskReminder(me){
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const {data} = await NJ.sb.from('tasks').select('status,due,done_at').eq('assigned_to', me.user_id).or('status.eq.open,done_at.gte.' + start.toISOString());
  const box = document.getElementById('taskDue');
  if(!box || !data || !data.length) return;
  const m = NJ.taskMeter(data);
  if(!m.total && !m.later) return;
  box.hidden = false;
  box.innerHTML = '<div class="tm-head"><b>Your tasks</b><a href="' + NJ.APPS.todo.path + '">Open my tasks ›</a></div>' + NJ.meterHtml(m, 'Today');
}

/* People who use Customers see the follow-ups due for them (theirs, or ones they added for anyone). */
async function followReminder(me){
  if(!NJ.canUse('crm')) return;
  const {data} = await NJ.sb.from('customer_activity').select('due,assigned_to,created_by').eq('kind', 'followup').eq('status', 'open').lte('due', NJ.todayIso());
  const mine = (data || []).filter(f => f.assigned_to === me.user_id || (!f.assigned_to && f.created_by === me.user_id));
  const box = document.getElementById('fuDue');
  if(!box || !mine.length) return;
  const late = mine.filter(f => f.due < NJ.todayIso()).length;
  box.hidden = false;
  if(late) box.style.cssText = 'border-color:var(--a);background:var(--a-bg);color:var(--a);font-weight:600';
  box.innerHTML = mine.length + ' customer follow-up' + (mine.length > 1 ? 's' : '') + ' due' + (late ? ', ' + late + ' overdue' : ' today') + '.' +
    ' <a href="' + NJ.APPS.crm.path + '#follow" style="color:inherit;font-weight:600">Open follow-ups ›</a>';
}

/* People who use the design library see customer pieces that have arrived (the ones they took; the owner sees all). */
async function designReminder(me){
  if(!NJ.canUse('designs')) return;
  const {data} = await NJ.sb.from('designs').select('created_by').eq('kind', 'enquiry').eq('status', 'received');
  const mine = (data || []).filter(d => me.is_owner || d.created_by === me.user_id);
  const box = document.getElementById('desDue');
  if(!box || !mine.length) return;
  box.hidden = false;
  box.innerHTML = mine.length + ' customer ' + (mine.length > 1 ? 'pieces have' : 'piece has') + ' arrived. Tell the customer' + (mine.length > 1 ? 's' : '') + '.' +
    ' <a href="' + NJ.APPS.designs.path + '#arrived" style="color:inherit;font-weight:600">Open the list ›</a>';
}

NJ.start({home: true, onReady: render});
})();
</script>
</body>
</html>
