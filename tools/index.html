<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3B2420">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Natraj Jewels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared/natraj.css">
</head>
<body class="signed-out not-owner">

<header class="top">
  <div class="wrap">
    <span class="brand"><img src="img/logo-cream.png" alt="Natraj Jewels: Gold, Silver, Diamond"></span>
    <div class="access" id="access"></div>
    <div class="tabs" aria-hidden="true"></div>
  </div>
</header>

<main>
  <section>
    <div class="band"><div class="wrap">
      <div class="heading"><span class="eyebrow" id="hEyebrow">Welcome</span><h2 id="hTitle">Natraj Jewels tools</h2></div>
    </div></div>
    <div class="wrap content">
      <div id="home" class="loading">Loading…</div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <img src="img/logo-cream.png" alt="Natraj Jewels">
    <span>24, Eswaran Kovil St, Tiruppur 641604</span>
    <span>© <span id="year">2026</span> Natraj Jewels</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="shared/natraj.js"></script>
<script>
(function(){
'use strict';
const {esc, APPS} = NJ;
const box = document.getElementById('home');

function tile(href, name, desc, cls, ic){
  return '<a class="tile' + (cls ? ' ' + cls : '') + '" href="' + href + '"><span class="tile-top"><span class="tile-ic">' + NJ.icon(ic) + '</span><span class="eyebrow">' + (cls === 'owner' ? 'Owner' : 'App') + '</span></span><h3>' + esc(name) + '</h3><p>' + esc(desc) + '</p><span class="go">Open ›</span></a>';
}

async function render(me){
  if(!me){
    const setup = (await NJ.sb.rpc('setup_needed')).data === true;
    document.getElementById('hEyebrow').textContent = setup ? 'First time' : 'Welcome';
    document.getElementById('hTitle').textContent = setup ? 'Set up the owner' : 'Sign in to continue';
    box.className = '';
    box.innerHTML = '<div class="tiles">' +
      '<div class="form panel"><h3>' + (setup ? 'Set up the owner' : 'Sign in') + '</h3>' +
        '<p>' + (setup ? 'Choose the owner’s name and a 6-digit PIN. You will get a recovery code to write down.' : 'Choose your name and enter your 6-digit PIN.') + '</p>' +
        '<div class="bar"><button class="btn btn-maroon" id="go">' + (setup ? 'Set up the owner' : 'Sign in') + '</button></div></div>' +
      tile('attendance/#leave', 'Apply for leave', 'No PIN needed. Send a leave request for approval.', '', 'leave') +
    '</div>';
    document.getElementById('go').onclick = () => setup ? NJ.setupFlow() : NJ.signInFlow();
    return;
  }
  document.getElementById('hEyebrow').textContent = me.is_owner ? 'Owner' : 'Welcome';
  document.getElementById('hTitle').textContent = 'Hello, ' + me.name.split(' ')[0];
  const apps = Object.entries(APPS).filter(([k, a]) => NJ.canUse(k) || a.everyone);
  let h = '';
  if(me.is_owner){
    h += tile('dashboard/', 'Dashboard', 'Today at a glance: attendance, leave waiting and this month’s totals.', 'owner', 'dashboard');
    h += tile('people/', 'People & settings', 'Who can sign in, which apps they use, the staff list and shop settings.', 'owner', 'people');
  }
  h += apps.map(([k, a]) => tile(a.path, a.name, a.desc, '', k)).join('');
  if(!apps.length && !me.is_owner) h += '<div class="form panel"><h3>No apps yet</h3><p>Ask the owner to give you access to the apps you need.</p></div>';
  h += tile('attendance/#leave', 'Apply for leave', 'Send a leave request for approval.', '', 'leave');
  box.className = '';
  box.innerHTML = '<p class="notice" id="due" hidden></p><p class="notice" id="taskDue" hidden></p><p class="notice" id="fuDue" hidden></p><div class="tiles">' + h + '</div>';
  rateReminder(me).catch(() => {});
  taskReminder(me).catch(() => {});
  followReminder(me).catch(() => {});
}

/* The person who updates the gold & silver rate sees a reminder until today's rate is in. */
async function rateReminder(me){
  const [st, last, who] = await Promise.all([
    NJ.sb.from('settings').select('rate_due').eq('id', 1).maybeSingle(),
    NJ.sb.from('rates').select('set_at').order('set_at', {ascending: false}).limit(1),
    NJ.sb.rpc('rate_updaters')
  ]);
  const s = NJ.rateStatus(st.data, (last.data || [])[0], who.data);
  const box = document.getElementById('due');
  if(!box || !s.assignee || s.done || !(s.mine || (me.is_owner && s.late))) return;
  box.hidden = false;
  if(s.late) box.style.cssText = 'border-color:var(--a);background:var(--a-bg);color:var(--a);font-weight:600';
  box.innerHTML = (s.mine ? (s.late ? 'Late: please enter today’s gold &amp; silver rate. It was due by ' : 'Today’s gold &amp; silver rate is due by ') + esc(s.dueLabel) + '.'
    : 'Today’s rate is not in yet (' + esc(s.name) + ' ' + s.verb + ' it). It was due by ' + esc(s.dueLabel) + '.') +
    ' <a href="' + NJ.APPS.rates.path + '" style="color:inherit;font-weight:600">' + (s.mine ? 'Enter the rate ›' : 'Open the rate ›') + '</a>';
}

/* Anyone with open tasks sees how many, and how many are late. */
async function taskReminder(me){
  const {data} = await NJ.sb.from('tasks').select('due').eq('status', 'open').eq('assigned_to', me.user_id);
  const box = document.getElementById('taskDue');
  if(!box || !data || !data.length) return;
  const today = NJ.todayIso();
  const late = data.filter(t => t.due && t.due < today).length, td = data.filter(t => t.due === today).length;
  box.hidden = false;
  if(late) box.style.cssText = 'border-color:var(--a);background:var(--a-bg);color:var(--a);font-weight:600';
  box.innerHTML = 'You have ' + data.length + ' open task' + (data.length > 1 ? 's' : '') +
    (late ? ', ' + late + ' overdue' : '') + (td ? ', ' + td + ' due today' : '') + '.' +
    ' <a href="' + NJ.APPS.todo.path + '" style="color:inherit;font-weight:600">Open my tasks ›</a>';
}

/* People who use Customers see the follow-ups due for them (theirs, or ones they added for anyone). */
async function followReminder(me){
  if(!NJ.canUse('crm')) return;
  const {data} = await NJ.sb.from('customer_activity').select('due,assigned_to,created_by').eq('kind', 'followup').eq('status', 'open').lte('due', NJ.todayIso());
  const mine = (data || []).filter(f => f.assigned_to === me.user_id || (!f.assigned_to && f.created_by === me.user_id));
  const box = document.getElementById('fuDue');
  if(!box || !mine.length) return;
  const late = mine.filter(f => f.due < NJ.todayIso()).length;
  box.hidden = false;
  if(late) box.style.cssText = 'border-color:var(--a);background:var(--a-bg);color:var(--a);font-weight:600';
  box.innerHTML = mine.length + ' customer follow-up' + (mine.length > 1 ? 's' : '') + ' due' + (late ? ', ' + late + ' overdue' : ' today') + '.' +
    ' <a href="' + NJ.APPS.crm.path + '#follow" style="color:inherit;font-weight:600">Open follow-ups ›</a>';
}

NJ.start({home: true, onReady: render});
})();
</script>
</body>
</html>
